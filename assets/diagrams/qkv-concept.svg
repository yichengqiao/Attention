<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background: transparent;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Q, K, V 概念示意图
  </text>

  <!-- Query Box -->
  <rect x="50" y="100" width="200" height="120" rx="10" fill="url(#grad1)" opacity="0.8"/>
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Query (Q)
  </text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    "我在找什么？"
  </text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    What am I looking for?
  </text>

  <!-- Key Box -->
  <rect x="300" y="100" width="200" height="120" rx="10" fill="url(#grad1)" opacity="0.8"/>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Key (K)
  </text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    "这是什么？"
  </text>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    What is this?
  </text>

  <!-- Value Box -->
  <rect x="550" y="100" width="200" height="120" rx="10" fill="url(#grad1)" opacity="0.8"/>
  <text x="650" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Value (V)
  </text>
  <text x="650" y="170" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    "给你什么？"
  </text>
  <text x="650" y="195" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    What do I give you?
  </text>

  <!-- Computation Flow -->
  <g>
    <!-- Q and K interaction -->
    <path d="M 150 230 L 400 230 L 400 280" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
    <text x="275" y="220" font-family="Arial, sans-serif" font-size="14" fill="#6366f1" text-anchor="middle">
      相似度计算
    </text>

    <!-- Attention scores -->
    <rect x="300" y="290" width="200" height="60" rx="10" fill="url(#grad2)" opacity="0.7"/>
    <text x="400" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Attention Weights
    </text>
    <text x="400" y="335" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
      softmax(Q·K^T / √d_k)
    </text>

    <!-- Attention and Value -->
    <path d="M 500 320 L 650 320 L 650 230" stroke="#ec4899" stroke-width="3" fill="none" marker-end="url(#arrowpink)"/>
    <text x="575" y="310" font-family="Arial, sans-serif" font-size="14" fill="#ec4899" text-anchor="middle">
      加权
    </text>

    <!-- Output -->
    <rect x="300" y="380" width="200" height="80" rx="10" fill="url(#grad2)" opacity="0.9"/>
    <text x="400" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Output
    </text>
    <text x="400" y="435" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
      加权求和的结果
    </text>
    <text x="400" y="455" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      Attention(Q,K,V) = softmax(QK^T/√d_k)V
    </text>

    <!-- Arrow from attention to output -->
    <path d="M 400 350 L 400 380" stroke="#ec4899" stroke-width="3" fill="none" marker-end="url(#arrowpink)"/>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
    </marker>
    <marker id="arrowpink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ec4899" />
    </marker>
  </defs>
</svg>
