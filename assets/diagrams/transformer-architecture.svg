<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" style="background: transparent;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Transformer 架构
  </text>

  <!-- Encoder (Left) -->
  <g id="encoder">
    <rect x="100" y="80" width="280" height="550" rx="15" fill="url(#grad1)" opacity="0.2" stroke="#6366f1" stroke-width="3"/>
    <text x="240" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6366f1" text-anchor="middle">
      编码器 Encoder
    </text>

    <!-- Input Embedding -->
    <rect x="130" y="140" width="220" height="50" rx="8" fill="#6366f1" opacity="0.4"/>
    <text x="240" y="170" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">
      Input Embedding + PE
    </text>

    <!-- Self-Attention in Encoder -->
    <rect x="130" y="220" width="220" height="80" rx="8" fill="#8b5cf6" opacity="0.5" stroke="#6366f1" stroke-width="2"/>
    <text x="240" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Multi-Head
    </text>
    <text x="240" y="272" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Self-Attention
    </text>
    <text x="240" y="293" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      (Q, K, V 来自编码器)
    </text>

    <!-- Add & Norm -->
    <rect x="130" y="320" width="220" height="40" rx="6" fill="#6366f1" opacity="0.3"/>
    <text x="240" y="345" font-family="Arial, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">
      Add & Norm
    </text>

    <!-- Feed Forward -->
    <rect x="130" y="380" width="220" height="60" rx="8" fill="#8b5cf6" opacity="0.4"/>
    <text x="240" y="415" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">
      Feed Forward
    </text>

    <!-- Add & Norm -->
    <rect x="130" y="460" width="220" height="40" rx="6" fill="#6366f1" opacity="0.3"/>
    <text x="240" y="485" font-family="Arial, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">
      Add & Norm
    </text>

    <!-- N× indicator -->
    <text x="240" y="540" font-family="Arial, sans-serif" font-size="16" fill="#6366f1" text-anchor="middle">
      ×N 层
    </text>
    <rect x="130" y="555" width="220" height="50" rx="8" fill="#6366f1" opacity="0.5"/>
    <text x="240" y="585" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">
      编码器输出
    </text>
  </g>

  <!-- Decoder (Right) -->
  <g id="decoder">
    <rect x="520" y="80" width="280" height="550" rx="15" fill="url(#grad2)" opacity="0.2" stroke="#ec4899" stroke-width="3"/>
    <text x="660" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ec4899" text-anchor="middle">
      解码器 Decoder
    </text>

    <!-- Output Embedding -->
    <rect x="550" y="140" width="220" height="50" rx="8" fill="#ec4899" opacity="0.4"/>
    <text x="660" y="170" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">
      Output Embedding + PE
    </text>

    <!-- Masked Self-Attention -->
    <rect x="550" y="220" width="220" height="80" rx="8" fill="#f472b6" opacity="0.5" stroke="#ec4899" stroke-width="2"/>
    <text x="660" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Masked Multi-Head
    </text>
    <text x="660" y="267" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Self-Attention
    </text>
    <text x="660" y="288" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      (Q, K, V 来自解码器)
    </text>

    <!-- Add & Norm -->
    <rect x="550" y="320" width="220" height="40" rx="6" fill="#ec4899" opacity="0.3"/>
    <text x="660" y="345" font-family="Arial, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">
      Add & Norm
    </text>

    <!-- Cross-Attention -->
    <rect x="550" y="380" width="220" height="80" rx="8" fill="#f97316" opacity="0.5" stroke="#ec4899" stroke-width="2"/>
    <text x="660" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Multi-Head
    </text>
    <text x="660" y="432" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Cross-Attention
    </text>
    <text x="660" y="453" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      (Q来自解码器, K,V来自编码器)
    </text>

    <!-- Add & Norm -->
    <rect x="550" y="480" width="220" height="40" rx="6" fill="#ec4899" opacity="0.3"/>
    <text x="660" y="505" font-family="Arial, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">
      Add & Norm
    </text>

    <!-- Output -->
    <rect x="550" y="555" width="220" height="50" rx="8" fill="#ec4899" opacity="0.5"/>
    <text x="660" y="585" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">
      Linear + Softmax
    </text>
  </g>

  <!-- Connection between Encoder and Decoder -->
  <path d="M 350 580 L 430 580 Q 450 580 450 560 L 450 420 Q 450 400 470 400 L 550 400"
        stroke="#8b5cf6" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <circle cx="550" cy="400" r="5" fill="#8b5cf6"/>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle">
    K, V
  </text>

  <!-- Inputs and Outputs -->
  <text x="240" y="670" font-family="Arial, sans-serif" font-size="14" fill="#6366f1" text-anchor="middle">
    输入序列 (如: 源语言)
  </text>
  <text x="660" y="670" font-family="Arial, sans-serif" font-size="14" fill="#ec4899" text-anchor="middle">
    输出序列 (如: 目标语言)
  </text>

  <!-- Legend -->
  <rect x="30" y="650" width="15" height="15" fill="#8b5cf6" opacity="0.5"/>
  <text x="50" y="662" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Self-Attention</text>

  <rect x="160" y="650" width="15" height="15" fill="#f97316" opacity="0.5"/>
  <text x="180" y="662" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Cross-Attention</text>
</svg>
