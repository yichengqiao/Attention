<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: transparent;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Self-Attention 自注意力机制
  </text>

  <!-- Input Sequence -->
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    输入序列 Input Sequence
  </text>

  <g id="input-tokens">
    <rect x="100" y="110" width="120" height="50" rx="8" fill="url(#grad1)" opacity="0.6"/>
    <text x="160" y="142" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">Token 1</text>

    <rect x="250" y="110" width="120" height="50" rx="8" fill="url(#grad1)" opacity="0.6"/>
    <text x="310" y="142" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">Token 2</text>

    <rect x="400" y="110" width="120" height="50" rx="8" fill="url(#grad1)" opacity="0.6"/>
    <text x="460" y="142" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">Token 3</text>

    <rect x="550" y="110" width="120" height="50" rx="8" fill="url(#grad1)" opacity="0.6"/>
    <text x="610" y="142" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">Token N</text>
  </g>

  <!-- Linear Projections -->
  <g id="projections">
    <path d="M 160 160 L 160 210" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 310 160 L 310 210" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 460 160 L 460 210" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 610 160 L 610 210" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- QKV Generation -->
  <rect x="50" y="220" width="700" height="80" rx="10" fill="url(#grad1)" opacity="0.3" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    生成 Q, K, V (来自同一输入)
  </text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    Q = W_q × Input,  K = W_k × Input,  V = W_v × Input
  </text>

  <!-- Attention Matrix -->
  <path d="M 400 300 L 400 340" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="250" y="350" width="300" height="100" rx="10" fill="#8b5cf6" opacity="0.4" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Attention Scores
  </text>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    Score = softmax(Q·K^T / √d_k)
  </text>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    每个token关注所有token
  </text>

  <!-- Weighted Sum -->
  <path d="M 400 450 L 400 480" stroke="#ec4899" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="200" y="490" width="400" height="80" rx="10" fill="url(#grad1)" opacity="0.8"/>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Output = Attention(Q,K,V)
  </text>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    加权求和: Score × V
  </text>

  <!-- Connection visualization -->
  <g opacity="0.3">
    <line x1="160" y1="135" x2="310" y2="135" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="160" y1="135" x2="460" y2="135" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="310" y1="135" x2="460" y2="135" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ec4899" />
    </marker>
  </defs>
</svg>
