<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" style="background: transparent;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    Multi-Head Attention 多头注意力
  </text>

  <!-- Input -->
  <rect x="250" y="80" width="300" height="60" rx="10" fill="url(#grad1)" opacity="0.8"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    输入 Input (d_model)
  </text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
    [batch, seq_len, d_model]
  </text>

  <!-- Split arrow -->
  <path d="M 400 140 L 400 180" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">分割 Split</text>

  <!-- Multiple Heads -->
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    分割成 h 个头 (Split into h heads)
  </text>

  <g id="heads">
    <!-- Head 1 -->
    <rect x="80" y="220" width="140" height="200" rx="8" fill="#6366f1" opacity="0.3" stroke="#6366f1" stroke-width="2"/>
    <text x="150" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Head 1
    </text>
    <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Q₁, K₁, V₁</text>
    <rect x="95" y="285" width="110" height="40" rx="5" fill="#8b5cf6" opacity="0.5"/>
    <text x="150" y="310" font-family="Arial, sans-serif" font-size="11" fill="#f1f5f9" text-anchor="middle">Attention 1</text>
    <text x="150" y="350" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">语法关系</text>
    <text x="150" y="365" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Syntax</text>

    <!-- Head 2 -->
    <rect x="250" y="220" width="140" height="200" rx="8" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Head 2
    </text>
    <text x="320" y="270" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Q₂, K₂, V₂</text>
    <rect x="265" y="285" width="110" height="40" rx="5" fill="#a855f7" opacity="0.5"/>
    <text x="320" y="310" font-family="Arial, sans-serif" font-size="11" fill="#f1f5f9" text-anchor="middle">Attention 2</text>
    <text x="320" y="350" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">语义关系</text>
    <text x="320" y="365" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Semantics</text>

    <!-- Head 3 -->
    <rect x="420" y="220" width="140" height="200" rx="8" fill="#ec4899" opacity="0.3" stroke="#ec4899" stroke-width="2"/>
    <text x="490" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      Head 3
    </text>
    <text x="490" y="270" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Q₃, K₃, V₃</text>
    <rect x="435" y="285" width="110" height="40" rx="5" fill="#f472b6" opacity="0.5"/>
    <text x="490" y="310" font-family="Arial, sans-serif" font-size="11" fill="#f1f5f9" text-anchor="middle">Attention 3</text>
    <text x="490" y="350" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">位置关系</text>
    <text x="490" y="365" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Position</text>

    <!-- More heads indicator -->
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="24" fill="#6366f1" text-anchor="middle">...</text>
    <text x="640" y="320" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Head h</text>
  </g>

  <!-- Arrows from heads -->
  <path d="M 150 420 L 150 460 L 400 460" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 320 420 L 320 460 L 400 460" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 490 420 L 490 460 L 400 460" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Concatenation -->
  <rect x="250" y="480" width="300" height="70" rx="10" fill="url(#grad2)" opacity="0.6" stroke="#ec4899" stroke-width="2"/>
  <text x="400" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    拼接 Concatenate
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
    Concat(head₁, head₂, ..., headₕ)
  </text>

  <!-- Output projection -->
  <path d="M 400 550 L 400 580" stroke="#ec4899" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="250" y="590" width="300" height="70" rx="10" fill="url(#grad1)" opacity="0.8"/>
  <text x="400" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    输出投影 Output (d_model)
  </text>
  <text x="400" y="645" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
    W_O × Concat
  </text>

  <!-- Formula -->
  <text x="400" y="685" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    MultiHead(Q,K,V) = Concat(head₁,...,headₕ)W^O
  </text>
</svg>
